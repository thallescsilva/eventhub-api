spring:
  application:
    name: eventhub-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  cache:
    type: simple

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET:eventhub-default-secret-key-for-development-only-change-in-production}
    expiration: ${JWT_EXPIRATION:86400000}
