spring:
  application:
    name: eventhub-api
  datasource:
    url: jdbc:h2:mem:eventhub
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    secret: eventhub-default-secret-key-for-development-only-change-in-production
    expiration: 86400000

logging:
  level:
    com.tcs.eventhub: DEBUG
